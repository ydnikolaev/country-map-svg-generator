    - id: WKI-C35A01E965DC
      fingerprint: c35a01e965dced1e02617420667323f2480bb5bb03719246e7bd3db2391ddc3e
      scope: project
      title: Only the profile's own long side is served from the ladder; any other size falls back to source and blows the byte ceiling
      problem: Measured through the shipped CLI at P3/T4. Greenland at profile card renders in 2400 bytes with longSide 128 and fails with 59892 bytes against the 2500 ceiling at longSide 160. 128 is the card preset's own long side; 160 is one of that same preset's documented reference sizes (internal/geometry/presets/v1.json lists 90, 128, 160, 240 for card) and is the value the P3 specification's own example configuration uses. The failure is a fallback to the DEC-005 full-detail source path, and geometry reports it as hard_budget_exceeded with the raw byte count. The precise mechanism - whether the effective scale lands outside every band's ceiling, or the ladder simply carries no row for that scale - was not traced; what is verified is the cliff itself and its two endpoints. REQ-13 makes tight's long side a first-class configuration knob and QAB-1 documents card use from 90 to 240 px, so the sizes an author is invited to ask for are largely sizes that leave the ladder. The consequence for a producer is that a configuration which works on a small entity fails on a large one with no warning at authoring time.
      expected_outcome: A long side inside the profile's documented reference range is served from the committed ladder rather than falling back to full-detail source geometry, or the reference sizes and REQ-13's guidance are narrowed to what the ladder actually serves so the CLI stops inviting requests it cannot meet. Either way a producer learns at validate time rather than at generate time.
      status: captured
      owner: product-owner
      priority_band: high
      effort_band: large
      next_action: 'Belongs to internal/geometry and the ladder artifact (BND-003), which is P2 territory and currently fenced. P3 mitigates rather than fixes: the starter configuration no longer sets a long side, and the budget refusal now names the profile''s served size and the fallback instead of reporting a byte count. Decide during P2 governance reconciliation.'
