    - id: WKI-490046152C71
      fingerprint: 490046152c71b060bafa56b799f6862959f842e62fb3df542e49ab30a640f22d
      scope: project
      title: Does a card frame the mainland or the full UN claim including remote territories?
      problem: The viewBox is fitted to the whole projected source before any candidate is chosen (lod.go, fitGeometry over the full geometry), so it reserves space for components the silhouette may deliberately not draw. Chile's UN geometry spans 43.0 degrees of longitude because of Easter Island (-109.45), Salas y Gomez (-105.47) and the Juan Fernandez group (-80.7, -80.1); the mainland alone spans 13.5 degrees. Rendered, Chile sits against one edge of a near-square frame with most of the box empty. The United States shows the same effect via Alaska and Hawaii. This behaviour is identical before and after the T3 ladder wiring — the AU viewBox is 126.4x144 on both the ladder and source paths — so it is pre-existing, not a regression. It is visible now only because these entities finally render at all instead of failing on the byte budget. TestRepresentativeNaturalRatiosAndArbitraryFrames asserts ratios[CL] < 0.75, which encodes mainland framing, and is one of the known failing tests.
      expected_outcome: 'The owner decides the framing rule for a decorative card: frame the full claim as today, frame the drawn silhouette, or frame a primary landmass with a generic rule that carries no country literal. The decision then either realigns the natural-ratio test or changes the fit, and it belongs before T5''s owner contact sheet since that is where every such frame becomes visible at once.'
      status: deferred
      owner: product-owner
      priority_band: normal
      effort_band: medium
      next_action: Accept or dispose WKI-490046152C71 with mate backlog.
