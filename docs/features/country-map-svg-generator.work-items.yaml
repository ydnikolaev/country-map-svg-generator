      title: Amendment machine has no terminal edge out of applied, so AM-003/AM-004 permanently fence P2 and P3
      problem: 'Re-verified at mate CLI v1.4.3 (installed = latest) against the SSOT, not cited from the v1.4.1 filing: internal/workdocs/assets/bundle-v1/registries/state-machines.yaml:61-70 gives the amendment machine exactly one edge out of applied (verify to verified), and reject is legal only from proposed or impacting; internal/work/transition.go:144 exempts only cancel and invalidate from the fence, so spec complete is fenced too; internal/work/amendment.go:279 blocks on impacting, accepted and applied. AM-003 and AM-004 failed independent review (ADV-003, ADV-004) and can never earn a passing receipt, so they are a lifecycle sink. The registry is compiled into the CLI binary (go:embed assets/bundle-v1 consumed by workdocs.LoadCatalog), so mate fleet pull cannot lift this: the pending artifact update from v1.4.1 to v1.4.3 is a different release axis and a CLI release is required. Filed as FND-1B950D899CE4 and FND-CC7A8AAB239A, both still state new and both stamped mate_release v1.4.1. Consequence: everything from P2 T1 onward shipped as ungoverned engineering commits, P2 cannot close, P3 cannot start under the governed wrapper, and reconciliation debt 15 stays open.'
      expected_outcome: A failed applied amendment has a terminal disposition that lifts its fence, so P2 closes through the governed lifecycle, P3 dispatches under the governed wrapper, and the reconciliation debt 15 is discharged against real receipts rather than ungoverned commits.
