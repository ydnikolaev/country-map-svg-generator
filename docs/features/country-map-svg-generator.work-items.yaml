      fingerprint: 1da58e0fe7415e43bdab46361325c255e34bfa26abf169de19cf7996604c35f0
      scope: project
      title: Diagnostic identity record hashes the whole module graph, so any dependency change reddens it
      problem: 'loadDiagnosticIdentities in internal/geometry/cmd/lodbuild/diagnostic.go records GoModSHA256 and GoSumSHA256 as file digests of go.mod and go.sum, and diagnosticIdentityDrift compares them against frozen constants. Those two fields cover the entire module graph, including dependencies the diagnostic never touches: adding cobra and rogpeppe/go-internal for the P3 CLI, which nothing under internal/geometry imports, reddened TestDiagnosticIdentityDriftChecksEveryRecordedLoadBearingIdentity even though the full 30-resolution by 249-entity mapshaper ladder rebuild reproduced byte-identically in the same run and the internal/geometry package stayed green at 353s. Every other live field in the record is scoped to something the diagnostic actually consumes - the corpus identity, the recipe, the mapshaper pin, the tool lockfile, the twenty-file geometry source inventory, the serializer - and the source inventory is a self-consistency check rather than a frozen-value one, so it does not have this property. The record also carries four self-referential fields (BaselineCommit, BaselineTree, ScratchBefore, Command) that loadDiagnosticIdentities assigns from the same constants the drift check compares against, so they can never drift and contribute nothing.'
      expected_outcome: The identity record measures only what the diagnostic consumes, so a dependency added for an unrelated package does not redden a geometry provenance gate. Either the module-graph fields are narrowed to the dependency subset internal/geometry actually imports, or they are replaced by something with the same scoping property the source inventory already has. The four inert self-referential fields are either given a real source or dropped, so the record does not appear to check more than it does.
      status: captured
      owner: teamlead
      priority_band: normal
      effort_band: small
      next_action: 'Decide during P2 governance reconciliation, not from P3: narrowing this predicate weakens an existing gate, which needs P2''s evidence in hand. Until then, re-record the two constants with the determinism evidence named in the commit, as P3/T1 did.'
