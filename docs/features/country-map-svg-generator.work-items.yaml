          rationale: 'Closed by DEC-012. Root cause was not Russia-specific: the acceptance predicate judged topology on pre-canonical fitted coordinates, rejecting a self-crossing of ~1e-4 that the pipeline''s own q=0.01 canonicalization erases. Fixed on both the oracle and the runtime side so build and serve agree, and the ladder was rebuilt through its full binding chain. RU/un/standard moved from rung 24 at 508 bytes and 1 part to rung 224 at 6577 bytes and 16 parts; RU/un/compact from 24 to 80. Exactly 2 of 996 rows changed, which confirms Russia was the sole victim. All gates green against the rebuilt artifact.'
