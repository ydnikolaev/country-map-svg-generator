    - id: WKI-6638BACD6E20
      fingerprint: 6638bacd6e20c897a1d38d7caccc21e961ba4a3d93f5bda58d19b1e17e445309
      scope: project
      title: Ladder first-load costs 707 ms per process; decide lazy per-geometry decode in T3
      problem: EmbeddedLadderTable decodes the whole ~10 MB committed ladder artifact (996 rows, 283 candidate geometries) on first use, measured at 707 ms. It is behind sync.Once, so a long-lived process pays it once, and the linker drops the embed entirely when unreferenced (lodbuild stays 15.32 MB; a consumer calling the loader grows to 24.78 MB). But the P3 product is an agent-driven CLI that generates one SVG per invocation, and that invocation would pay the full 707 ms to decode 996 rows in order to use one. No accepted decision sets a startup budget, so this is a deliberate design call, not a violation.
      expected_outcome: T3 weighs the cost when it wires publishedLODTable and either accepts 707 ms with a recorded rationale or lands a lazy per-geometry decode so a single-entity run touches only its own rows and candidate. Either way the choice is explicit and measured, not inherited.
      status: captured
      owner: teamlead
      priority_band: normal
      effort_band: medium
      next_action: Measure a realistic single-SVG CLI invocation during T3 and choose between accepting the cost and per-geometry lazy decode
