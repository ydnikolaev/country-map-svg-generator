    - id: WKI-33B6EC2482B3
      fingerprint: 33b6ec2482b31c81faebcb1905892696d28f233098a5087f75dcf387ec2db8c5
      scope: project
      title: The ladder's finest-that-fits rule clusters every asset at the byte cap, 3.6x over QAB-2's median
      problem: 'First measured full-catalog distribution through the shipped CLI, at profile card with the default configuration: 248 assets written, 1 typed no-artifact, 476106 bytes total. Path bytes median 1964, p95 2183, max 2197. File bytes median 2165, p95 2384, max 2397. QAB-2 for card asks for a median of at most 0.6 KB, p95 at most 1.2 KB and max at most 2.5 KB as uncompressed file sizes, so the maximum is satisfied with nothing over 2500 while the median is 3.6x over and p95 is about 2x over. The cause is structural rather than accidental: the ladder selects, per geometry and band, the finest oracle-passing candidate, so finest-that-fits puts every entity just under the cap by construction and the distribution clusters at the ceiling instead of spreading below it. QAB-2''s median and p95 were written for a distribution in which most countries are simple and cheap. The two are not reconcilable by tuning; one of them has to change. Recorded in DEC-016.'
      expected_outcome: Either the ladder's selection rule targets a byte distribution rather than only a ceiling, or QAB-2's median and p95 are updated from this measured evidence. Whichever it is, the decision is taken by the owner against a rendered page rather than from a number, because it is a page-weight against fidelity judgement - 248 cards at roughly 2.1 KB is 476 KB uncompressed - and the same class of judgement DEC-008 and DEC-013 established as an owner approval over rendered output.
      status: captured
      owner: product-owner
      priority_band: high
      effort_band: large
      next_action: Due in P4, which ARCH-001 already names as the owner of measured full-catalog distributions and the only accepted route to updating an architecture budget. Show the owner a rendered page at the current distribution alongside one at the QAB-2 target before proposing either change. Changing the ladder rebuilds the committed artifact and changes every asset, so it is not a passing edit.
