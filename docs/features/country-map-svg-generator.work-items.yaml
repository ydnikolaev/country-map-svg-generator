    - id: WKI-C83B0B9EB4EE
      fingerprint: c83b0b9eb4ee141596061d6c2332c9e712ceb292d86a8c82a8f399268fad2279
      scope: project
      title: Russia selects ladder rung 24 and uses 7% of its hero byte budget
      problem: 'In the committed ladder, RU/un/standard selects rung 24 — 508 bytes of a 7500 cap, 45 points, 1 part, IoU 0.9204 — and RU/un/compact selects the same rung at 437 of 2200. Rendered, Russia is a crude blob while Italy at the same band spends 6829 of 7500. Russia is the only anomaly of its kind: exactly 14 committed rows select a rung at or below 64, and the other 12 (CA, GR, AX, DK, FK, HK) sit at 68-98% of their byte budget, i.e. coarse because they hit the cap. Russia is coarse while leaving 93% of the hero budget unspent, which means the fine-to-coarse search rejected every rung from 512 down to 32 for a reason the artifact does not record (per-attempt logs are stored only on no_artifact rows). The oracle cannot see this: minimum IoU is 0.40 and Russia scores 0.92, so a crude blob passes the acceptance predicate comfortably. Suspected cause is the antimeridian crossing damaging topology at finer rungs, unverified.'
      expected_outcome: The rejection reasons for RU rungs 512 through 32 are measured (needs a Mapshaper sweep, so it is T1/T5 territory rather than T3), the root cause is named, and either Russia selects a finer rung or the coarse selection is recorded as a understood, accepted outcome. A top-200 entity rendering as a blob at 7% of budget is not shippable without one of those two.
      status: done
      owner: teamlead
      priority_band: high
      effort_band: medium
      next_action: No further mutation is legal.
