    - id: WKI-B05B4B4287A2
      fingerprint: b05b4b4287a265e00b0cb84557e34750d0286f65dd84f1bf500742d36669e49b
      scope: project
      title: make check runs serially because wall-clock brakes flake under parallel load
      problem: 'Several tests assert wall-clock brakes — a 30s post-build micro-brake in lodbuild, a 10s per-generation bound, a 30s build bound — which exist to catch a runaway search, the failure mode behind the twenty interrupted runs. They were reliable while the suite was light. After T3 and T4 the geometry package takes 322s (a 197s full-catalog shipped gate plus a 48s mutation tooth plus a 28s offline ladder gate) and lodbuild takes 373s (a 175s Node rebuild plus a 75s sampled characterization), so running packages in parallel makes those brakes measure CPU contention rather than the code: lodbuild''s micro-brake was observed at 34.5s alongside the geometry package and comfortably under 30s on its own. Makefile check now passes -p 1, which makes the brakes meaningful again at the cost of running roughly the sum of the packages — about 12 minutes — instead of the slowest one.'
      expected_outcome: The brakes are expressed in work done rather than seconds — candidate evaluations, phase attempts, Mapshaper invocations — so they measure the runaway-search behaviour they were written for and are immune to scheduling. Parallel package execution is then restored and make check drops back toward the slowest package rather than the sum.
      status: captured
      owner: teamlead
      priority_band: normal
      effort_band: medium
      next_action: Replace the wall-clock assertions in lodbuild main_test.go with work counters, then drop -p 1 from the Makefile and confirm the suite stays green
