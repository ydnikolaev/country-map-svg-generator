answers:
    - id: Q-001
      question: Какая политика сущностей и спорных границ определяет базовый набор карт?
      answer: Базовый каталог охватывает все актуальные сущности ISO 3166-1; профиль границ un используется по умолчанию, а профиль de-facto доступен как настраиваемая альтернатива.
      source: owner
    - id: Q-002
      question: Какой контракт стилевых вариантов и кастомизации должен выдавать генератор?
      answer: Геометрия отделена от оформления. Генератор предоставляет наследуемые YAML/JSON-пресеты и дизайн-токены, глобальные и страновые переопределения, пять базовых стилей, режим standalone с запечённым оформлением и режим themed-inline со стабильными CSS-хуками, CSS-переменными и лёгкими анимационными токенами. Допускается опциональный advanced-слой для градиентов, паттернов и фильтров; CLI обязан поддерживать перенос профилей, schema validation, preview, explain и машиночитаемый JSON-вывод.
      source: owner
    - id: Q-003
      question: Как генератор должен определять, размещать и настраивать пины столиц и пользовательских точек?
      answer: Пины выключены по умолчанию. Поддерживаются режимы none, capital, all-capitals и custom; версионированный локальный реестр хранит именованные столицы, координаты и роли, а custom принимает пользовательские географические точки. Глобальные и страновые переопределения позволяют скрывать, смещать, заменять и добавлять точки. Маркер имеет отдельные токены, CSS-хук и варианты dot, ring и pin; после проекции валидатор проверяет размещение или явно разрешённое смещение.
      source: owner
    - id: Q-004
      question: Для каких размеров отображения оптимизируется базовый профиль и какой предел веса считается успешным?
      answer: MVP оптимизируется под два продуктовых слота. hero рассчитан примерно на 500–700 CSS px и имеет целевые бюджеты median <= 1.8 KB, p95 <= 4 KB, max <= 8 KB. card рассчитан на 90–160 CSS px и до 240 px в акцентной карточке с бюджетами median <= 0.6 KB, p95 <= 1.2 KB, max <= 2.5 KB. Оба используют декоративный soft-organic силуэт с контролируемым упрощением; малые детали удаляются по видимой площади, но характерные части островных стран защищены реестром исключений. На карточках пин и постоянная анимация выключены, основной клиентский режим — кешируемая SVG mask; hero использует themed-inline. Документация обязана отдельно описывать производительный producer workflow и client integration. Профиль detail исключён из MVP и отложен в проектный backlog.
      source: owner
    - id: Q-005
      question: В каком переносимом виде коллеги должны получать и запускать локальный инструмент?
      answer: Инструмент поставляется как один автономный кроссплатформенный бинарник для macOS arm64/amd64, Linux arm64/amd64 и Windows amd64, без Node/Python и без сетевых запросов при генерации. Он включает версионированные данные, схемы и базовые пресеты, поддерживает переносимые YAML/JSON-профили, release-архивы и go install, детерминированный вывод, стабильный JSON-контракт, exit codes и команды init, validate, preview, generate, explain, inspect и version. Сгенерированный каталог является автономным артефактом.
      source: owner
    - id: Q-006
      question: Какая внутренняя архитектура геоданных и SVG-пайплайна лучше всего выполняет принятый контракт автономного бинарника?
      answer: Go CLI работает с версионированным immutable geometry corpus, отделённым от редкого обновления upstream-источников. Source adapters, corpus compiler, geometry pipeline, style renderer и output packagers являются независимыми границами. Natural Earth и UN-aligned overlay фиксируются по версии; orb используется для GeoJSON и упрощения; центрированная equal-area проекция и минимальный SVG writer остаются малыми изолированными модулями с D3 golden fixtures. Структурный валидатор ловит самопересечения, потерю обязательных компонентов, некорректные пины и превышение бюджетов. Runtime не требует Node, Python, GDAL или сети.
      source: inference
    - id: Q-007
      question: Какой rollout-приоритет определяет границы первой поставки?
      answer: Первая цель — готовый локальный проект, который генерирует и интегрирует карты для текущего сайта. Правильные расширяемые границы закладываются сразу, но release automation, широкая дистрибуция, публичность и дополнительная платформенная обвязка выполняются последней волной без расширения основного MVP.
      source: owner
