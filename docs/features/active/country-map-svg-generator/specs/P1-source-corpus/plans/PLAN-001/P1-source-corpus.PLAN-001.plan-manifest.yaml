tasks:
    - id: T1
      outcome: Pin the exact 249-entity ISO snapshot and Natural Earth source set with receipts, establish the Go module, and define strict catalog/source models.
      depends_on: []
      writes:
        - data/sources
        - go.mod
        - go.sum
        - internal/catalog/model.go
        - internal/catalog/model_test.go
        - internal/catalog/source.go
        - internal/catalog/source_test.go
        - internal/catalog/testdata/source
      owner: catalog-contract
      wave: W1
    - id: T2
      outcome: Reconcile pinned geometry, boundary profiles, capitals, overrides, and protected features into a fully validated presentation-free catalog.
      depends_on:
        - T1
      writes:
        - data/policy
        - internal/catalog/cmd/corpuscompile
        - internal/catalog/compile.go
        - internal/catalog/compile_test.go
        - internal/catalog/geojson.go
        - internal/catalog/geojson_test.go
        - internal/catalog/testdata/compile
        - internal/catalog/validate.go
        - internal/catalog/validate_test.go
      owner: catalog-compiler
      wave: W2
    - id: T3
      outcome: Publish immutable content-addressed corpus v1, deterministic comparison output, decoder, and generated embedded bundle without in-place rewrites.
      depends_on:
        - T2
      writes:
        - data/corpus/v1
        - data/reports/v1
        - internal/catalog/canonical.go
        - internal/catalog/canonical_test.go
        - internal/catalog/compare.go
        - internal/catalog/compare_test.go
        - internal/catalog/embedded.go
        - internal/catalog/embedded_gen.go
      owner: corpus-publisher
      wave: W3
    - id: T4
      outcome: Prove all five validation obligations with full-corpus and mutation tests and wire deterministic generation into the project ceiling.
      depends_on:
        - T3
      writes:
        - Makefile
        - internal/catalog/fullcatalog_test.go
        - internal/catalog/mutations_test.go
        - internal/catalog/testdata/mutations
      owner: corpus-verifier
      wave: W4
waves:
