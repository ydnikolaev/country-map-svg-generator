tasks:
    - id: T0
      outcome: Finish the production-capable builder, temporarily build all 283 geometry IDs, run all-entity/profile/preset structural and hard-budget checks, accept the representative visual sheet, and stop unless topology, provenance, deterministic rebuild and 2500/8000-byte maxima pass.
      depends_on: []
      writes:
        - internal/geometry/cmd/lodbuild
        - internal/geometry/lod/tool
        - internal/geometry/lod/v1.recipe.json
        - internal/geometry/testdata/lod-spike
      owner: lod-spike
      wave: W1
    - id: T1
      outcome: Publish canonical corpus-bound compact and standard artifacts from the T0-frozen builder/tool/recipe for all 283 P1 geometry IDs with exact coverage, hash and disappearance provenance.
      depends_on:
        - T0
      writes:
        - internal/geometry/lod/v1.compact.json
        - internal/geometry/lod/v1.manifest.json
        - internal/geometry/lod/v1.standard.json
        - internal/geometry/lod_build_test.go
      owner: lod-artifact
      wave: W2
    - id: T2
      outcome: Compute retention from full source, integrate scale-only LOD selection, component/ring-matched symmetric deviation and topology guards, complete required restoration, additive CTR-002 provenance and lossless full-source fallback without changing layout or marker transforms.
      depends_on:
        - T1
      writes:
        - go.mod
        - go.sum
        - internal/geometry/adapter.go
        - internal/geometry/adapter_test.go
        - internal/geometry/diagnostic.go
        - internal/geometry/fit.go
        - internal/geometry/fit_test.go
        - internal/geometry/lod.go
        - internal/geometry/lod_test.go
        - internal/geometry/marker.go
        - internal/geometry/marker_test.go
        - internal/geometry/math.go
        - internal/geometry/model.go
        - internal/geometry/model_test.go
        - internal/geometry/normalize.go
        - internal/geometry/normalize_test.go
        - internal/geometry/override.go
        - internal/geometry/override_test.go
        - internal/geometry/overrides
        - internal/geometry/pipeline.go
        - internal/geometry/pipeline_test.go
        - internal/geometry/preset.go
        - internal/geometry/preset_test.go
        - internal/geometry/presets
        - internal/geometry/projection.go
        - internal/geometry/projection_test.go
        - internal/geometry/simplify.go
      owner: lod-runtime
      wave: W3
    - id: T3
      outcome: Complete exact removal/restoration accounting, fixed-grid commands, generic MaxPathBytes resolution, and optional topology-checked selective softening with deterministic linear budget fallback.
      depends_on:
        - T2
      writes:
        - internal/geometry/path.go
        - internal/geometry/path_test.go
        - internal/geometry/retain.go
        - internal/geometry/retain_test.go
        - internal/geometry/soften.go
        - internal/geometry/soften_test.go
      owner: lod-path
      wave: W4
    - id: T4
      outcome: Prove full corpus, D3 parity, natural and arbitrary layouts, scale-only selection, protection, budgets, visual approval, deterministic artifacts and the offline project ceiling.
      depends_on:
        - T3
      writes:
        - Makefile
        - internal/geometry/approval_test.go
        - internal/geometry/integration_test.go
        - internal/geometry/mutations_test.go
        - internal/geometry/oracle_test.go
        - internal/geometry/testdata/approval
        - internal/geometry/testdata/d3
        - internal/geometry/testdata/mutations
      owner: lod-verifier
      wave: W5
