estimate:
    unit: agent-hour
    low: 4
    likely: 7
    high: 12
    confidence: medium
    basis: RUN-019 proved variable-component resolution cannot close the AE byte-overhead or AQ deviation gap; the accepted fix is a localized deterministic byte-cap fallback rung in lod.go plus narrowly-scoped correction of over-strict tier assertions, with the frozen ladder, recipe, oracle, serializer and budgets untouched. Remaining work is the rung, its teeth, the representative and full-catalog owner gates, frozen-ladder publication verification and an independent audit.
