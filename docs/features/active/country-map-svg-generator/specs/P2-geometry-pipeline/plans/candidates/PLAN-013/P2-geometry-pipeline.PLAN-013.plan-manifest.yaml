tasks:
    - id: T0A
      outcome: Add the deterministic byte-cap tier-selection fallback rung in lod.go, fold exact serialization and the frozen per-tier byte cap into candidate evaluation, correct the over-strict tier assertions, and pass synthetic, SH and representative gates with owner approval of the contact sheet.
      depends_on: []
      writes:
        - internal/geometry/cmd/lodbuild
        - internal/geometry/lod.go
        - internal/geometry/lod_test.go
      owner: tier-fallback-selection-and-assertion-correction
      wave: W0
    - id: T0B
      outcome: Prove all 996 catalog outputs select a within-budget fidelity-preserving tier under the fallback with no over-cap hard error while a coarser-or-source tier fits, and land one clean T0 commit.
      depends_on:
        - T0A
      writes:
        - internal/geometry/lod_catalog_test.go
      owner: geometry-foundation-integrator
      wave: W1
    - id: T1
      outcome: Perform two byte-identical rebuilds and verify the frozen v1 recipe, ladder, generated initializer and oracle are byte-identical and the public embedded offline selection exercises the fallback.
      depends_on:
        - T0B
      writes:
        - internal/geometry/lod_build_test.go
      owner: silhouette-ladder-publisher
      wave: W2
    - id: T2
      outcome: Complete P2 parity, mutation, override, marker, budget and visual evidence proving deterministic within-cap tier-fallback selection, with a fresh independent audit.
      depends_on:
        - T1
      writes:
        - Makefile
        - internal/geometry/approval_test.go
        - internal/geometry/integration_test.go
        - internal/geometry/mutations_test.go
        - internal/geometry/oracle_test.go
        - internal/geometry/testdata/approval
        - internal/geometry/testdata/d3
        - internal/geometry/testdata/mutations
      owner: geometry-verifier
      wave: W3
