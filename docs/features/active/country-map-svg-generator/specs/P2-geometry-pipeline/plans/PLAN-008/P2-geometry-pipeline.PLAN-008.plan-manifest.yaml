      owner: lod-selection-micro
      wave: W0
    - id: T0B
      outcome: Integrate the complete geometry foundation, full-corpus and warm-production brakes, public nil seam and owner visuals, then land one clean T0 commit containing the verified T0A and T0B union.
      depends_on:
        - T0A
      writes:
