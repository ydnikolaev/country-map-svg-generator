tasks:
    - id: T1
      outcome: Freeze CTR-002, generic tight/contain layout, fitted-scale auto quality, preset data, typed diagnostics, P1 adapter, and maintained Go dependencies.
      depends_on: []
      writes:
        - go.mod
        - go.sum
        - internal/geometry/adapter.go
        - internal/geometry/adapter_test.go
        - internal/geometry/diagnostic.go
        - internal/geometry/model.go
        - internal/geometry/model_test.go
        - internal/geometry/preset.go
        - internal/geometry/preset_test.go
        - internal/geometry/presets/v1.json
      owner: geometry-contract
      wave: W1
    - id: T2
      outcome: Implement canonical normalization, Lambert azimuthal equal-area projection, adaptive subdivision, natural-aspect tight bounds, uniform contain fitting, and the common marker transform.
      depends_on:
        - T1
      writes:
        - internal/geometry/fit.go
        - internal/geometry/fit_test.go
        - internal/geometry/normalize.go
        - internal/geometry/normalize_test.go
        - internal/geometry/projection.go
        - internal/geometry/projection_test.go
        - internal/geometry/testdata/projection
      owner: projection-kernel
      wave: W2
    - id: T3
      outcome: Implement protected retention, visible-area removal, validated simplification, bounded softening, marker anomalies, versioned overrides, canonical commands, and explicit pre/post component and ring disappearance accounting.
      depends_on:
        - T2
      writes:
        - internal/geometry/marker.go
        - internal/geometry/marker_test.go
        - internal/geometry/override.go
        - internal/geometry/override_test.go
        - internal/geometry/overrides/v1.json
        - internal/geometry/path.go
        - internal/geometry/path_test.go
        - internal/geometry/pipeline.go
        - internal/geometry/pipeline_test.go
        - internal/geometry/retain.go
        - internal/geometry/retain_test.go
        - internal/geometry/simplify.go
        - internal/geometry/simplify_test.go
        - internal/geometry/soften.go
        - internal/geometry/soften_test.go
        - internal/geometry/testdata/pipeline
      owner: geometry-pipeline
      wave: W3
    - id: T4
      outcome: Pin reproducible d3-geo 3.1.1 development fixtures and prove projection, natural bounds, uniform fitting, and markers without a normal Node dependency.
      depends_on:
        - T2
      writes:
        - internal/geometry/oracle_test.go
        - internal/geometry/testdata/d3/README.md
        - internal/geometry/testdata/d3/fixtures
        - internal/geometry/testdata/d3/generate.mjs
        - internal/geometry/testdata/d3/package-lock.json
        - internal/geometry/testdata/d3/package.json
      owner: d3-oracle
      wave: W3
    - id: T5
      outcome: Add full-corpus, mutation, natural-ratio, arbitrary-layout, paired-frame fitted-scale quality, disappearance-accounting, deterministic approval-sheet, budget, and project-ceiling evidence.
      depends_on:
        - T3
        - T4
      writes:
        - Makefile
        - internal/geometry/approval_test.go
        - internal/geometry/integration_test.go
        - internal/geometry/mutations_test.go
        - internal/geometry/testdata/approval
        - internal/geometry/testdata/mutations
      owner: geometry-verifier
      wave: W4
