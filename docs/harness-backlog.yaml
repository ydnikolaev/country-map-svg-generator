    - id: FND-A50ADF64186A
      scope: mate
      severity: medium
      area: validation
      summary: A corpus gate that aborts on the first failure makes a systemic defect look like a single-entity one
      observed: TestLODSpikeFullCorpus sweeps 996 outputs but calls t.Fatalf on the first over-budget entity, so it reports exactly one. For twenty runs every plan read that one name as the whole problem and scoped itself to it; PLAN-013 states as fact that RU card and hero hold their tiers, which was never true and was simply never reached. A one-off sweep that recorded every failure instead of the first showed 75 failing outputs across 27 entities, and separately that three of the four hard-coded tier expectations in the checkpoint test asserted behavior the corpus never produced. The scale, not the first name, is what selects the right fix.
      expected: A gate that sweeps a population should collect and report the full failure set, then fail once with the count, the distribution and a bounded sample. Fail-fast is right for a unit invariant and wrong for a corpus sweep, because the first failure is an arbitrary function of iteration order and hides both the magnitude and any later assertion that never executed. Worth stating in the validator-authoring guidance as a property of population gates.
      fingerprint: a50adf64186a629ed75c54ec63865b85b0ead14d47ac8e76aab5a7cd12b8e4c0
      project: country-map-svg-generator
      mate_release: v1.4.1
