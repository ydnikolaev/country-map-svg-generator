    - id: FND-10CCB7CD18A0
      scope: mate
      severity: high
      area: plan-lifecycle
      summary: Failed run cannot authorize plan invalidation or successor planning
      observed: P2/RUN-007 finished with terminal status failed after an accepted plan brake proved PLAN-007 violates its 10s/30s ceilings. The documented plan invalidate command says it handles an unexecutable, failed-audit, or interrupted plan, but rejects the exact latest failed RUN-007-RESULT because run-result authority is hard-coded to status=interrupted and outcome=blocked. plan scaffold PLAN-008 then rejects P2 as in_progress because PLAN-007 is not invalidated, leaving no direct successor route from a failed plan experiment.
      expected: An exact latest terminal failed run that proves its accepted plan unexecutable can authorize plan invalidation and successor planning, or run finish routes this outcome to a documented remediation transition without requiring a synthetic interrupted run.
      fingerprint: 10ccb7cd18a03e42a5e1d7de6a9d887d50028b0d0528f5fa189ff2a86f9dc491
      project: country-map-svg-generator
