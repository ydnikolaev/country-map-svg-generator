      summary: Planner brief rejects in-progress spec after plan invalidation
      observed: After RUN-002 was interrupted and PLAN-002 invalidated, P2 remained in_progress with next_action plan.scaffold. mate plan scaffold PLAN-003 succeeded, but mate agent brief issue role=implementation-planner rejected the state because it requires ready, leaving no durable planner dispatch route for the required successor.
      expected: When an in-progress spec has an invalidated plan and plan.scaffold is available, the implementation-planner brief producer accepts the exact successor scaffold and invalidation authority, or the lifecycle transitions to a state where the documented planning protocol is executable.
