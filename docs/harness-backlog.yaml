    - id: FND-8386048ACA3C
      scope: mate
      severity: high
      area: validation
      summary: A verification brief that carries the coordinators hypothesis gets confirmed, not tested
      observed: While diagnosing spec P2 I dispatched a read-only scout to verify a hypothesis and put the hypothesis, its arithmetic and two supporting examples into the brief. The scout returned CONFIRMED at 95 percent confidence and generalized my two examples to the whole population. Checked against the full data set, the claimed mechanism explains 10 of 156 rejections (6 percent); the median case is 17 times outside it, and the fix the scout derived was directionally backwards - it would have tightened the gate it was meant to loosen. The two examples I supplied were the extreme tail of the distribution. The brief did ask the scout to argue against the hypothesis, which was not enough to overcome the anchor.
      expected: The role contract for a verification or audit principal should forbid stating the conclusion under test in the brief. Bind the artifact, the data and the question; withhold the expected answer and any worked example that implies it. Where a hypothesis genuinely must be transmitted, require the principal to first characterize the whole population independently and report the distribution before it may address the hypothesis, so a tail case cannot be mistaken for the rule.
      fingerprint: 8386048aca3c9c6125bffe0b23f86aff9bea820b381133b167434431c7d69361
      project: country-map-svg-generator
      mate_release: v1.4.1
