    - id: FND-CC7A8AAB239A
      scope: mate
      severity: medium
      area: amendment-lifecycle
      summary: An applied amendment that fails independent verification has no corrective transition and is stuck in applied
      observed: 'AM-003 in country-map-svg-generator was proposed, impact-fenced, accepted and applied, then failed independent review with two blocking findings against its factual diagnosis. mate amendment verify correctly refuses the blocking advisor receipt: advisor receipt ADV-003 does not pass and bind the current amendment closure. But mate amendment reject refuses too: illegal amendment transition reject from applied. The amendment is now terminal-but-unverified with no route out, and the only correction available is to author a successor amendment restating the same scope. The applied normative output stays in the specification meanwhile, carrying the exact wording the review blocked.'
      expected: reject or an equivalent corrective transition should be legal from applied when bound to a blocking advisor receipt, unwinding or superseding the applied normative output. If a successor amendment is deliberately the only correction route, the CLI refusal should say so and the next action should name it, rather than leaving the operator to discover that reject is unavailable and infer the workaround.
      fingerprint: cc7a8aab239a23188581d52495183951ca1be6bb985ec8d46b7f8bf77a4d5b75
