    - id: FND-1B3065946FF8
      scope: mate
      severity: high
      area: lifecycle
      summary: 'No non-convergence brake: a spec can loop invalidate-plan/run/interrupt indefinitely without any forced review of the diagnosis'
      observed: Spec P2 of country-map-svg-generator reached 20 runs, 13 plans and 12 invalidations with zero passing runs. Every plan-invalidate/successor/run-start/run-interrupt cycle was individually legal, so the lifecycle never objected. Each successor inherited the previous plans framing of the defect (output byte budget) and attacked the same symptom with a different mechanism; no step in the protocol ever asked whether the shared diagnosis was correct. A bounded architecture review after run 20 found the real root cause was an acceptance metric that is discontinuous and non-monotone in the tolerance the search descends on, so the byte overrun was the last link of a four-link chain that no plan had examined.
      expected: The lifecycle should brake on repeated non-convergence for one spec. After N consecutive terminal runs that are not pass on the same spec, plan-supersede should be unavailable and the only available next actions should be an approach review or an amendment, so the next artifact is a re-examined diagnosis rather than plan N+1. The teamlead skill already lists repeated failure of the same gate as a stop condition, but it is prose the coordinator may or may not honour, with no machine fence and no counter in the snapshot.
      fingerprint: 1b3065946ff8dd4c20daee1faf5309d0e361e5c138de9ed77be4dd214fde523e
      project: country-map-svg-generator
      mate_release: v1.4.1
